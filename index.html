<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrictlyMine . AU Interaktif</title>
    <style>
       /* 1. ATURAN TAMPILAN (CSS) */
      body{
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        color: white;
        user-select: none;
      }
      
      /* Kerangka HP Iphone */
      .iphone-frame {
        width: 375px;
        height: 700px;
        background: #111;
        border-radius: 40px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(255,255,255,0.1);
      }

      /* Tampilan Layar Kunci (Lockscreen) dengan Tema Pita */
      #lockscreen {
        position: absolute;
        top: 0; left: 0; 
        width: 100%; height: 100%;
        background-image: url('https://i.pinimg.com/236x/33/15/62/331562bb2ee691801f5036c76f631cb0.jpg');
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 60px 20px 40px 20px;
        z-index: 10;
        transition: transform 0.4 ease;
      }

      .lock-time {
        font-size: 75px;
        font-weight: 700;
        letter-spacing: -2px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      }

      .lock-date {
        font-size: 16px;
        font-weight: 500;
        margin-top: -40px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.6);
      }

      .swipe-text {
        font-size: 13px;
        font-weight: 500;
        opacity: 0.9;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-5px); }
        60% { transform: translateY(-3px); }
      }
     </style>
  </head>
